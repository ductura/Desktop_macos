name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Testovi pomoćnih funkcija
        run: swift test
      - name: Izrada paketa
        run: ./scripts/build-dmg.sh
      - name: Funkcionalni test (preuzimanje, Aplikacije, pokretanje)
        run: ./Tests/functional/install-and-launch.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: Ductura-macOS, path: dist/Ductura-macOS.dmg }

  # Tests of ci-ok itself (scripts/ci-ok.test.mjs) on Linux: the repository
  # has no other Node tests, and build-test stays as it is (DAN-885).
  ci-ok-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install the YAML parser (package-lock.json, no scripts)
        run: npm ci --ignore-scripts
      - name: ci-ok tests
        run: node --test scripts/ci-ok.test.mjs

  # Shared scans from ductura/.github, called by full SHA (DAN-880).
  secret-scan:
    uses: ductura/.github/.github/workflows/secret-scan.yml@6f392fc2c87b1473266378d94895f1273087297c # main after .github#18

  # Off pull requests there is nothing to compare: skipped, and ci-ok allows that skip only there.
  dependency-review:
    if: ${{ github.event_name == 'pull_request' }}
    uses: ductura/.github/.github/workflows/dependency-review.yml@6f392fc2c87b1473266378d94895f1273087297c # main after .github#18

  # The one required status (DAN-885): green only when every job above
  # succeeded; failure, cancelled, skipped or a missing result fails it,
  # except dependency-review skipped off pull requests (ALLOW_SKIPPED, the
  # rule of ci-ok.yml in ductura/.github). A plain job, so the check is named
  # exactly ci-ok.
  ci-ok:
    name: ci-ok
    if: ${{ always() }}
    needs: [build-test, ci-ok-test, secret-scan, dependency-review]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every needed job succeeded
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
          ALLOW_SKIPPED: ${{ github.event_name != 'pull_request' && 'dependency-review' || '' }}
        run: |
          # ci-ok:begin
          set -euo pipefail
          if ! jq -e 'type == "object" and length > 0' >/dev/null 2>&1 <<< "$NEEDS"; then
            echo "::error::needs must be a non-empty JSON object"
            exit 1
          fi
          allowed="$(tr -s ' \t\r\n' '\n' <<< "$ALLOW_SKIPPED" | sed '/^$/d' | jq -R . | jq -sc .)"
          problems="$(jq -r --argjson allowed "$allowed" '
            (($allowed - keys) | map("allow-skipped names a job that is not in needs: \(.)"))
            + (to_entries | map(
                ((.value | objects | .result) // "missing") as $r
                | if $r == "success" then empty
                  elif $r == "skipped" and (.key as $k | $allowed | index($k)) then empty
                  else "job \(.key) result: \($r)" end))
            | .[]' <<< "$NEEDS")"
          if [ -n "$problems" ]; then
            while IFS= read -r line; do echo "::error::$line"; done <<< "$problems"
            exit 1
          fi
          echo "ci-ok: $(jq length <<< "$NEEDS") job(s) passed"
          # ci-ok:end
